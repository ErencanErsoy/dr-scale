<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dr. Scale</title>
<style>
  :root{--bg:#F1F4F3;--card:#FFF;--ink:#15201F;--ink2:#33474A;--muted:#63797C;
    --line:#DDE4E3;--line2:#C4D0CE;--petrol:#0F4C5C;--petrol-soft:#E3EDF0;
    --accent:#A03B33;--neg:#9E2119;--neg-soft:#F9E4E2;
    --sh:0 1px 1px rgba(21,32,31,.04),0 4px 14px rgba(21,32,31,.05)}
  @media (prefers-color-scheme:dark){:root{--bg:#111917;--card:#182321;--ink:#E8F1EF;
    --ink2:#C0D2D0;--muted:#8AA2A3;--line:#293937;--line2:#3A4E4C;--petrol:#6FB6C4;
    --petrol-soft:#173135;--accent:#DA8B83;--neg:#DE7A72;--neg-soft:#2D1817;
    --sh:0 1px 1px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--ink);padding:24px;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
  .box{width:100%;max-width:392px;background:var(--card);border:1px solid var(--line);
    border-top:3px solid var(--petrol);border-radius:6px;box-shadow:var(--sh);padding:28px 28px 24px}
  .mk{display:block;margin-bottom:18px}
  .mk svg{display:block;height:32px;width:auto}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:19px;margin:0 0 6px;line-height:1.3}
  p.s{margin:0 0 20px;font-size:13px;color:var(--ink2);line-height:1.6}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
  input{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:4px;
    background:var(--card);color:var(--ink);font:inherit;font-size:14px}
  input:focus-visible{outline:2px solid var(--petrol);outline-offset:0;border-color:var(--petrol)}
  button{width:100%;margin-top:12px;font:inherit;font-size:13px;font-weight:600;padding:10px 14px;
    border-radius:4px;border:1px solid var(--petrol);background:var(--petrol);color:#fff;cursor:pointer}
  button:hover{background:#0B3D4A}
  button:disabled{opacity:.6;cursor:default}
  button:focus-visible{outline:2px solid var(--petrol);outline-offset:2px}
  .msg{margin-top:13px;font-size:12.5px;min-height:1.4em;color:var(--muted);line-height:1.5}
  .msg.err{color:var(--neg);background:var(--neg-soft);padding:8px 10px;border-radius:4px}
  .ft{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);line-height:1.6}
</style>
</head>

    say("Dieser Browser unterstützt die benötigte Verschlüsselung nicht. Bitte einen aktuellen Browser verwenden.",true);return;}
  if(!pw.value){say("Bitte ein Passwort eingeben.",true);return;}
  go.disabled=true;say("Wird entschlüsselt …",false);
  var raw=b64(DATA), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  crypto.subtle.importKey("raw",new TextEncoder().encode(pw.value),"PBKDF2",false,["deriveKey"])
    .then(function(k){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},
        k,{name:"AES-GCM",length:256},false,["decrypt"]);})
    .then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);})
    .then(function(buf){
      var html=new TextDecoder().decode(buf);
      document.open();document.write(html);document.close();})
    .catch(function(){
      go.disabled=false;
      say("Das Passwort ist nicht korrekt.",true);
      pw.select();});
});
})();
